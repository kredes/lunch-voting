[build-system]
requires = [
    # Support for setuptools.build_meta was added in 36.6.0 by
    # https://github.com/pypa/setuptools/pull/1143
    "setuptools>=36.6.0",
    # For building wheels
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "convious_assignment"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
]
description = "Convious Recruitment Python Assignment"
dynamic = ["version", "readme"]
dependencies = [
    "requests == 2.32.3",
    "fastapi[standard] == 0.115.12",
    "SQLAlchemy == 2.0.41",
    "PyJWT == 2.10.1",
    "bcrypt == 4.3.0",
]

[project.optional-dependencies]
test = [
    "build == 1.2.2",
    "pytest == 8.4.0",
    "pytest-cov == 6.1.1",
    "pytest-asyncio == 1.0.0",
]

lint = [
    "mypy == 1.15.0",
    "ruff == 0.11.10",
    "types-requests == 2.32.0.20250515",
    "pre-commit == 4.2.0",
]

[options]
package_dir = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}
readme = {file = ["README.md"]}


[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov --cov-report html --cov-report term -v --import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = "ignore::DeprecationWarning:ast.*"


[tool.mypy]
exclude = ["build"]

[tool.ruff]
include = ["src/*", "tests/*"]
exclude = ["__pycache__"]
line-length = 100
